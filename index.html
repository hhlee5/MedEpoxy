<title>MedEpoxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a clinic worklist console. Three tabs. Review puts the note beside what was pulled from it.
   Episode runs a stepper over a task list. */
:root {
  --bg: #EDF0F4; --surface: #FFFFFF; --surface-2: #F3F5F8; --ink: #1A2330; --muted: #5A6675; --line: #D3D9E1;
  --accent: #1F5FA8; --accent-ink: #FFFFFF; --accent-tint: #E1ECF8; --bar: #12304F; --bar-ink: #FFFFFF;
  --ok: #1E7B4A; --ok-tint: #E0F2E8; --warn: #8A5200; --warn-tint: #FBEFD9; --crit: #B3261E; --crit-tint: #FADFDC;
  --font-display: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1218; --surface: #151D26; --surface-2: #1B2531; --ink: #E4EAF0; --muted: #93A1B0; --line: #2B3745;
    --accent: #6DA8E8; --accent-ink: #08182B; --accent-tint: #172B43; --bar: #0A1B2E; --bar-ink: #E4EAF0;
    --ok: #5CC48D; --ok-tint: #163526; --warn: #E3A650; --warn-tint: #3A2B12; --crit: #F28279; --crit-tint: #3D1C1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1218; --surface: #151D26; --surface-2: #1B2531; --ink: #E4EAF0; --muted: #93A1B0; --line: #2B3745;
  --accent: #6DA8E8; --accent-ink: #08182B; --accent-tint: #172B43; --bar: #0A1B2E; --bar-ink: #E4EAF0;
  --ok: #5CC48D; --ok-tint: #163526; --warn: #E3A650; --warn-tint: #3A2B12; --crit: #F28279; --crit-tint: #3D1C1A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2.1rem); letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.top .sub { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.badge { display: inline-block; font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--warn-tint); color: var(--warn); border: 1px solid var(--warn); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { font: inherit; font-weight: 600; background: none; color: var(--muted); border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.notepick { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 8px 12px; }
.chipbtn { font: inherit; font-size: 0.85rem; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; }
.chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
textarea { width: 100%; font-family: var(--font-body); font-size: 0.95rem; line-height: 1.55; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; resize: vertical; min-height: 220px; }
input[type="text"], select { font: inherit; font-family: var(--font-mono); font-size: 0.9rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }

.fields { width: 100%; border-collapse: collapse; }
.fields td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.fields tr:first-child td { border-top: 0; }
.fields .k { width: 34%; font-weight: 500; }
.fields .src { font-size: 0.78rem; color: var(--muted); margin-top: 4px; font-family: var(--font-body); }
.fields .st { width: 1%; white-space: nowrap; text-align: right; }
@media (max-width: 560px) { .fields .k { width: 38%; } }

.chip { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-tint); color: var(--ok); }
.chip.warn { background: var(--warn-tint); color: var(--warn); }
.chip.crit { background: var(--crit-tint); color: var(--crit); }
.chip.info { background: var(--accent-tint); color: var(--accent); }
.chip.neutral { background: var(--surface-2); color: var(--muted); }

.gate { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 6px; }
.btn { font: inherit; font-weight: 600; border-radius: 6px; padding: 9px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 5px 11px; font-size: 0.85rem; }

.reqlist { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; }
.reqlist li { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; }

.callout { border: 1px solid var(--crit); background: var(--crit-tint); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.callout.calm { border-color: var(--ok); background: var(--ok-tint); }
.callout strong { font-family: var(--font-display); font-size: 1.05rem; }

.rail { display: flex; overflow-x: auto; padding-block: 6px 10px; }
.node { flex: 1 0 104px; position: relative; text-align: center; padding: 28px 6px 0; min-width: 104px; }
.node::before { content: ''; position: absolute; top: 9px; left: -50%; right: 50%; height: 3px; background: var(--line); }
.node:first-child::before { display: none; }
.node.done::before { background: var(--ok); }
.node.stalled::before, .node.next::before { background: var(--line); }
.dot { position: absolute; top: 0; left: 50%; width: 21px; height: 21px; margin-left: -10px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--accent-ink); line-height: 1; }
.node.done .dot { background: var(--ok); border-color: var(--ok); }
.node.next .dot { border-color: var(--accent); }
.node.stalled .dot { background: var(--crit); border-color: var(--crit); }
.node.waiting .dot { border-style: dashed; }
.node .nm { font-weight: 600; font-size: 0.85rem; line-height: 1.25; }
.node .dd { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.node .ss { font-size: 0.75rem; font-weight: 600; margin-top: 2px; }
.node.done .ss { color: var(--ok); } .node.stalled .ss { color: var(--crit); } .node.next .ss { color: var(--accent); } .node.waiting .ss { color: var(--muted); }

.slider { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.slider input[type="range"] { flex: 1 1 220px; min-width: 0; accent-color: var(--accent); }

.task { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task .pill { flex: 0 0 96px; }
.task .body { flex: 1 1 260px; min-width: 0; }
.task .t { font-weight: 600; }
.undobox { margin-top: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; }
.undobox input[type=text] { width: 100%; }
.proprow { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.92rem; }
.proprow > input[type=checkbox] { margin-top: 10px; }
.propedit { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tin { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.propedit input[type=text] { width: 100%; }
.linkbtn { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
.task.focus { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.linkbtn:hover { color: var(--accent); }
.task .meta { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
.task .route { font-size: 0.85rem; margin-top: 6px; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; }

.tablewrap { overflow-x: auto; }
.grid { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 0.88rem; }
.grid th, .grid td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--line); }
.grid th { font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.grid td:first-child, .grid th:first-child { text-align: left; }
.grid .m { font-weight: 700; }
.grid .m.ok { color: var(--ok); } .grid .m.bad { color: var(--crit); } .grid .m.na { color: var(--muted); font-weight: 400; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.barrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 0.88rem; }
.track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); }
.fill.low { background: var(--crit); }
@media (max-width: 520px) { .barrow { grid-template-columns: 110px minmax(0, 1fr) 70px; } }
.big { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.probe { padding: 10px 0; border-top: 1px solid var(--line); }
.probe:first-child { border-top: 0; }
.probe .quote { font-size: 0.85rem; color: var(--muted); margin-block: 4px; }
ul.plain { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; transition: none !important; } }

/* ---- EHR chrome ---- */
body { font-size: 14px; line-height: 1.45; margin: 0; }
.appbar { background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; height: 48px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 26px; height: 26px; border-radius: 5px; background: #fff; color: #12304F; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.word { font-weight: 600; font-size: 17px; letter-spacing: 0.01em; }
.appmeta { display: flex; align-items: center; gap: 14px; font-size: 13px; }
.appmeta .badge { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.35); font-weight: 500; }
.wrap { max-width: 1180px; padding-block: 12px 40px; }
h1, h2, h3 { font-weight: 600; }
h2 { font-size: 1rem; }
.tabs { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 4px 0 0; gap: 0; margin-bottom: 12px; padding-inline: 4px; }
.tab { padding: 11px 18px; font-size: 14px; }
.panel { border-radius: 4px; padding: 14px; }
.btn, .chipbtn, input[type="text"], select, textarea, .tin, .undobox, .callout, .route { border-radius: 4px; }
.btn { padding: 7px 14px; font-weight: 500; }
.btn.small { padding: 4px 10px; }
.chip { border-radius: 3px; font-weight: 600; font-size: 0.72rem; }
.chipbtn { padding: 4px 12px; }

.pbanner { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 4px; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 8px; }
.pb-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.pb-name { font-size: 1.15rem; font-weight: 600; }
.pb-main span { color: var(--muted); }
.pb-main .pb-name { color: var(--ink); }
.ptool { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.ptool select { width: auto; min-width: 280px; font-family: var(--font-body); }
.callout { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 8px 12px; margin-bottom: 8px; }
.callout strong { font-size: 0.95rem; font-weight: 600; }
.rail { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 8px 8px; margin-bottom: 8px; }

.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.phead, .prow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 140px 64px 150px; gap: 10px; align-items: start; padding: 8px 12px; }
.phead { background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; align-items: center; }
.pstep { border-bottom: 1px solid var(--line); }
.pstep:last-child { border-bottom: 0; }
.pstep.focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.prow { padding-block: 9px; }
.prow .c-a { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.prow .c-o, .prow .c-d { color: var(--muted); }
.prow .meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.prow .pv { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.exp { font: inherit; text-align: left; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
.exp:hover .tt { color: var(--accent); }
.caret { color: var(--muted); font-size: 0.7rem; width: 10px; flex: 0 0 10px; }
.cnt { color: var(--muted); font-weight: 400; font-size: 0.78rem; }
.pdetail { margin: 0 12px 10px 114px; border-left: 3px solid var(--line); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 5px; font-size: 0.88rem; }
.dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; }
.dk { color: var(--muted); }
.pextra { margin: 0 12px 10px 114px; }
.dl .linkbtn { font-weight: 500; color: var(--accent); }
.tchip { font-size: 0.72rem; font-weight: 600; color: var(--warn); background: var(--warn-tint); padding: 0 6px; border-radius: 3px; }
.tw { display: inline-flex; gap: 6px; align-items: baseline; }
@media (max-width: 820px) {
  .phead { display: none; }
  .prow { grid-template-columns: minmax(0, 1fr) auto; }
  .prow .c-o, .prow .c-d { display: none; }
  .pdetail, .pextra { margin-left: 12px; }
  .dl { grid-template-columns: 1fr; gap: 0; }
  .appmeta span:first-child { display: none; }
}

/* ---- plan rows: explicit layout, overrides the older .task rules ---- */
.task.prow { display: grid; border-top: 0; padding: 9px 12px; gap: 4px 12px; grid-template-columns: 92px minmax(0, 1fr) 140px 70px 150px; grid-template-areas: "st t o d a"; align-items: start; }
.prow .c-st { grid-area: st; } .prow .c-t { grid-area: t; min-width: 0; } .prow .c-o { grid-area: o; } .prow .c-d { grid-area: d; } .prow .c-a { grid-area: a; }
.phead { grid-template-columns: 92px minmax(0, 1fr) 140px 70px 150px; gap: 4px 12px; }
.prow .mo { display: none; }
.prow .meta { display: flex; flex-wrap: wrap; gap: 2px 8px; }
.prow .pv { flex: 1 0 100%; display: block; }
.prow .tt { min-width: 0; }
@media (max-width: 820px) {
  .task.prow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "st a" "t t"; }
  .prow .c-o, .prow .c-d { display: none; }
  .prow .mo { display: inline; }
  .prow .c-a { justify-content: flex-end; }
  .prow .c-st { align-self: center; }
}
.pextra .undobox { max-width: 100%; }
</style>

<div class="appbar"><div class="brand"><span class="logo" aria-hidden="true">M</span><span class="word">MedEpoxy</span></div><div class="appmeta"><span>Sample Coordinator, Care coordinator</span><span class="badge">Synthetic data only</span></div></div>
<div class="wrap">
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="review" id="tab-review">Review note</button>
    <button class="tab" role="tab" data-tab="episode" id="tab-episode">Plan</button>
    <button class="tab" role="tab" data-tab="tasks" id="tab-tasks">My tasks</button>
  </div>

  <section id="view-review" role="tabpanel" aria-labelledby="tab-review"></section>
  <section id="view-episode" role="tabpanel" aria-labelledby="tab-episode" hidden></section>
  <section id="view-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden></section>
</div>

<script>
/* Core logic for the Hep C Episode Tracker prototype.
   Synthetic notes, a rule-based extractor that stands in for the language model,
   illustrative payer rule sets, episode builder, and a small evaluation harness.
   No patient data. Payer rules are examples, not real policy. */

var FIELDS = [
  { id: 'hcv_type', label: 'Infection type (acute or chronic)' },
  { id: 'rna', label: 'HCV RNA (IU/mL)' },
  { id: 'genotype', label: 'Genotype' },
  { id: 'fibrosis', label: 'Fibrosis stage' },
  { id: 'cirr_labs', label: 'Cirrhosis labs (bilirubin, albumin, INR)' },
  { id: 'hiv', label: 'HIV status' },
  { id: 'hbv', label: 'HBV status' },
  { id: 'ab', label: 'HCV antibody (acute only)' },
  { id: 'prior_tx', label: 'Prior treatment' },
  { id: 'resistance', label: 'Drug resistance test' },
  { id: 'regimen', label: 'Planned regimen' },
  { id: 'ribavirin', label: 'Ribavirin in regimen' },
  { id: 'rbv_labs', label: 'Ribavirin labs (hemoglobin, hematocrit, platelets)' },
  { id: 'duration', label: 'Duration (weeks)' },
  { id: 'plan_discussed', label: 'Treatment plan discussed with patient' },
  { id: 'payer', label: 'Payer type' }
];
var EVAL_FIELDS = [{ id: 'dx', label: 'Active HCV diagnosis' }].concat(FIELDS).concat([{ id: 'barriers', label: 'Access barriers' }]);

var PREFERRED = ['glecaprevir/pibrentasvir', 'sofosbuvir/velpatasvir'];
var PAYERS = {
  il_medicaid: { name: 'Illinois Medicaid (HFS)', real: true, requires: ['rna', 'genotype', 'fibrosis', 'regimen'], responseLab: false },
  md_medicaid: { name: 'Maryland Medicaid (HealthChoice)', real: true, requires: ['rna', 'genotype', 'fibrosis', 'hiv', 'hbv', 'regimen', 'plan_discussed'], responseLab: false },
  medicaid: { name: 'Example Medicaid plan (other state)', requires: ['rna', 'fibrosis', 'prior_tx', 'regimen'], responseLab: true },
  commercial: { name: 'Example commercial plan', requires: ['rna', 'genotype', 'fibrosis', 'regimen'], responseLab: false },
  ma: { name: 'Example Medicare Advantage plan', requires: ['rna', 'genotype', 'prior_tx', 'regimen'], responseLab: true }
};
var MD_SOURCES = [
  { text: 'Maryland Medicaid HCV clinical criteria, May 2026 (current): all HCV drugs need PA. Chronic HCV needs genotype and subtype, HCV RNA within 180 days (90 if cirrhotic, with bilirubin, albumin and INR), an accepted fibrosis test with no minimum stage, HIV and HBV status, and drug resistance testing if indicated. Prior DAA exposure needs genotype before and after, plus treatment history. A separate section covers acute HCV.', url: 'https://health.maryland.gov/mmcp/pap/docs/HCV-Clinical-Criteria.pdf' },
  { text: 'Changes from the July 2022 criteria to May 2026: the adherence evaluation, the treatment plan recommendation and the regimen tables are gone. Regimens now follow the FDA label. Contraception with ribavirin is recommended instead of required. The acute HCV section is new.' },
  { text: 'Maryland Medicaid PA form (MDH 070121, 2021): asks for weight, regimen, genotype, fibrosis test and Metavir stage, treatment history, HCV RNA, HIV and HBV viral loads, transplant history, and cirrhosis or ribavirin labs. Fax 410-333-5398. It still has an adherence line and a treatment plan question that the 2026 criteria dropped.' },

/* Stands in for the signed-in user. The EHR version would read this from the login. */
var CURRENT_USER = { name: 'Sample Coordinator', role: 'Care coordinator' };
var S = {
  tab: 'review', noteId: 3, text: '', ext: null, vals: {}, barriers: [],
  completed: [], open: {}, epPid: 'p1', epFocus: null, noteFor: null, noteDraft: '', denial: null, newTask: null, team: null, role: 'Care coordinator', teamMsg: '', undoFor: null, undoDraft: { reason: '' }, audit: []
};
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function noteById(id) { for (var i = 0; i < NOTES.length; i++) if (NOTES[i].id === id) return NOTES[i]; }

function loadExtraction() {
  S.ext = extractWithChart(S.text);
  S.vals = {};
  FIELDS.forEach(function (f) { S.vals[f.id] = S.ext.f[f.id].v; });
  S.barriers = Object.keys(S.ext.barriers);
}

/* ---- review tab ---- */
function renderReview() {
  var el = $('view-review');
  el.innerHTML =
    '<div class="cols">' +
      '<div class="panel">' +
        '<h2>Clinic note</h2>' +
        
        '<textarea id="note-text" aria-label="Clinic note text" spellcheck="false"></textarea>' +
        '<div class="label" style="margin:14px 0 4px">Chart data (synthetic, stands in for the EHR)</div>' +
        '<ul class="reqlist" id="chartlist" style="gap:8px">' + CHART.rows.map(function (r) { return '<li style="flex-direction:column;gap:0"><strong style="font-weight:600">' + esc(r[0]) + '</strong><span class="muted">' + esc(r[1]) + '</span></li>'; }).join('') + '</ul>' +
      '</div>' +
      '<div class="stack">' +
        '<div class="panel"><h2>Pulled from the note</h2>' +
          '<table class="fields" id="fields"></table>' +
          '<div id="barriers" style="margin-top:10px"></div>' +
        '</div>' +
        '<div class="panel" id="payerpanel"></div>' +
        '<div class="panel" id="paform" hidden></div>' +
        '<div class="panel"><div class="gate" style="border-top:0;padding-top:0;margin-top:0"><div id="gatemsg"></div><button class="btn" id="approve">Approve and open plan</button></div></div>' +
      '</div>' +
    '</div>';
  $('note-text').value = S.text;
  renderFields();
}

function renderFields() {
  if (!S.ext.dx) {
    $('fields').innerHTML = '<tr><td><span class="chip neutral">No active HCV diagnosis found</span><div class="src">' + (S.ext.dxSnippet ? 'Closest mention: ' + esc(S.ext.dxSnippet) : 'No hepatitis C mention in this note.') + ' No episode will be opened.</div></td></tr>';
    $('barriers').innerHTML = '';
    renderPayerPanel();
    return;
  }
  var req = requiredFor(S.vals);
  var rows = FIELDS.map(function (f) {
    var v = S.vals[f.id], src = S.ext.f[f.id].s, input;
    if (f.id === 'payer') {
      input = '<select id="f-payer" data-field="payer">' +
        '<option value=""' + (v ? '' : ' selected') + '>Not documented</option>' +
        Object.keys(PAYERS).map(function (k) { return '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + esc(PAYERS[k].name) + '</option>'; }).join('') + '</select>';

    for (qi = 0; qi < np.ep.steps.length; qi++) if (!np.done[np.ep.steps[qi].id] && np.ep.steps[qi].due > ns.due) { at = qi; break; }
    if (at < 0) np.ep.steps.push(ns); else np.ep.steps.splice(at, 0, ns);
    S.newTask = null; S.teamMsg = 'Added for ' + np.name + ': ' + ns.short + ' (' + ns.owner + ').';
    return rerender();
  }
  if (t.dataset.rmstep) { var rk = t.dataset.rmstep.split(':'), rp = patientById(rk[0]); if (rp) rp.ep.steps = rp.ep.steps.filter(function (x) { return x.id !== rk[1]; }); return rerender(); }
  if (t.dataset.issue) { S.denial = { key: t.dataset.issue, text: '', images: [], fileName: '', fileNote: '', err: '', busy: false, result: null, on: [], example: false }; S.undoFor = null; return rerender(); }
  if (t.id === 'outcancel') { S.denial = null; return rerender(); }
  if (t.id === 'denial-example') { var ek = S.denial.key.split(':'), ep0 = patientById(ek[0]), es = null; ep0.ep.steps.forEach(function (x) { if (x.id === ek[1]) es = x; }); S.denial.text = ISSUE_EXAMPLES[es.kind || es.id] || ISSUE_EXAMPLES.other; S.denial.images = []; S.denial.fileName = ''; S.denial.example = true; return rerender(); }
  if (t.id === 'denial-go') {
    var dk = S.denial.key.split(':'), dp = patientById(dk[0]), DD = S.denial, dstp0 = null;
    if (dp) dp.ep.steps.forEach(function (x) { if (x.id === dk[1]) dstp0 = x; });
    if (!dp || !dstp0 || !(DD.text.trim() || (DD.images && DD.images.length))) return;
    DD.busy = true; DD.err = ''; DD.fallbackWhy = ''; DD.ctl = new AbortController(); rerender();
    readDenial(dp, dstp0, DD).then(function (res) { return res; }, function (e) {
      if (e && e.code === 'cancelled') return null;
      if (!DD.text.trim()) { DD.err = 'Claude could not read the images (' + (e && e.code || 'error') + '). Paste the text instead.'; return null; }
      DD.fallbackWhy = (e && e.code) || 'error';
      var r = suggestIssue(dp, dstp0, DD.text); r.source = 'rules'; return r;
    }).then(function (res) {
      if (S.denial !== DD) return;
      DD.busy = false;
      if (res) { DD.result = res; DD.on = res.tasks.map(function () { return true; }); }
      rerender();
    });
    return;
  }
  if (t.id === 'denial-stop') { if (S.denial && S.denial.ctl) S.denial.ctl.abort(); return; }
  if (t.id === 'denial-addown') {
    var R = S.denial.result; R.tasks.splice(R.tasks.length - 1, 0, { short: 'Your step', label: '', owner: 'Nurse', delay: 2, why: 'Added by you', note: '' });
    S.denial.on.splice(R.tasks.length - 2, 0, true); rerender();
    var ins = document.querySelectorAll('[data-tedit^="label|"]'); if (ins.length) ins[ins.length - 2 >= 0 ? ins.length - 2 : 0].focus();
    return;
  }
  if (t.id === 'denial-back') { S.denial.result = null; return rerender(); }
  if (t.id === 'denial-add') {
    var Dn = S.denial, dkk = Dn.key.split(':'), dpat = patientById(dkk[0]), dstep = null;
    if (!dpat) return;
    dpat.ep.steps.forEach(function (x) { if (x.id === dkk[1]) dstep = x; });
    var picked = Dn.result.tasks.filter(function (tk, i) { return Dn.on[i] && tk.label.trim(); });
    var maxo = 0; picked.forEach(function (tk) { if (!tk.recheck && tk.short !== 'Resubmit' && tk.delay > maxo) maxo = tk.delay; });
    picked.forEach(function (tk) { if (tk.short === 'Resubmit' && tk.delay <= maxo) tk.delay = maxo + 1; });
    var maxr = maxo; picked.forEach(function (tk) { if (!tk.recheck && tk.delay > maxr) maxr = tk.delay; });
    picked.forEach(function (tk) { if (tk.recheck && tk.delay <= maxr) tk.delay = maxr + (tk.kind === 'reply' ? 9 : 5); });
    picked = picked.map(function (tk, i) { return { tk: tk, i: i }; }).sort(function (a, b) { return (!!a.tk.recheck - !!b.tk.recheck) || a.tk.delay - b.tk.delay || a.i - b.i; }).map(function (x) { return x.tk; });
    var pshift = 0; picked.forEach(function (tk) { if (tk.delay > pshift) pshift = tk.delay; });
    if (!picked.length) return;
    var ilabel = 'Issue: ' + (Dn.result.found.length && Dn.result.found[0].rule !== 'Not matched to a known rule' ? Dn.result.found[0].rule : 'needs review');
    var res2 = completeStep(dpat, dkk[1], null, { next: picked, shift: pshift, label: ilabel });
    dpat.denialText = dpat.denialText || {}; dpat.denialText[dkk[1]] = Dn.text.trim(); dpat.doneInfo = dpat.doneInfo || {}; dpat.doneInfo[dkk[1]] = { by: S.role, day: dpat.day };
    S.completed.push({ pid: dpat.id, id: dkk[1], owner: dstep.owner, day: dpat.day });
    S.denial = null;
    S.teamMsg = dpat.name + ': ' + dstep.short + ', ' + ilabel.toLowerCase() + '. Added ' + plural(res2.ids.length, 'step') + '.';
    return rerender();
  }
  if (t.dataset.pdone) {
    var pp = t.dataset.pdone.split(':'), pat = null;
    S.team.forEach(function (x) { if (x.id === pp[0]) pat = x; });
    if (!pat) return;
    var stp = null; pat.ep.steps.forEach(function (x) { if (x.id === pp[1]) stp = x; });
    pat.done[pp[1]] = true; pat.doneInfo = pat.doneInfo || {}; pat.doneInfo[pp[1]] = { by: S.role, day: pat.day };
    if (stp) S.completed.push({ pid: pat.id, id: stp.id, owner: stp.owner, day: pat.day });
    var nx = null; for (var q = 0; q < pat.ep.steps.length; q++) if (!pat.done[pat.ep.steps[q].id]) { nx = pat.ep.steps[q]; break; }
    S.teamMsg = pat.name + ': done, ' + (stp ? stp.short : '') + '. ' + (nx ? 'Next is with ' + nx.owner + ': ' + nx.short + '.' : 'Episode complete.');
    return rerender();
  }
  if (t.id === 'skip3' || t.id === 'skip3e') { S.team.forEach(function (x) { x.day += 3; }); S.teamMsg = 'Moved ahead 3 days.'; return rerender(); }
  if (t.id === 'resetteam' || t.id === 'resetdemo') { resetDemo(); return rerender(); }
  if (t.id === 'pa-download') { downloadPaPdf(); return; }
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.tedit && S.denial && S.denial.result) {
    var te = el.dataset.tedit.split('|'), tk = S.denial.result.tasks[parseInt(te[1], 10)];
    if (tk) { if (te[0] === 'delay') { var dn = parseInt(el.value, 10); tk.delay = isNaN(dn) ? 0 : Math.max(0, Math.min(60, dn)); } else tk[te[0]] = el.value; if (te[0] === 'label') tk.short = el.value.split(/\s+/).slice(0, 3).join(' '); }
    return;
  }
  if (el.dataset && el.dataset.nt && S.newTask) {
    var nk = el.dataset.nt; S.newTask[nk] = nk === 'delay' ? Math.max(0, Math.min(60, parseInt(el.value, 10) || 0)) : el.value;
    if (nk === 'text') { var na = $('nt-add'); if (na) na.disabled = !el.value.trim(); }
    return;
  }
  if (el.id === 'stepnote-text') { S.noteDraft = el.value; return; }
  if (el.id === 'denial-text' && S.denial) { S.denial.text = el.value; S.denial.example = false; var go = $('denial-go'); if (go) go.disabled = !el.value.trim(); return; }
  if (el.id === 'note-text') {
    S.text = el.value; S.noteId = 0; loadExtraction();
    document.querySelectorAll('#notepick .chipbtn').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
    renderFields(); return;
  }
  if (el.dataset && el.dataset.field) {
    var id = el.dataset.field, v = el.value.trim();
    if (id === 'rna' || id === 'duration') { var n = Number(v.replace(/,/g, '')); S.vals[id] = v === '' || isNaN(n) ? null : n; }
    else S.vals[id] = v === '' ? null : v;
    updateChips(); return;
  }
  if (el.id === 'undo-reason') {
    S.undoDraft.reason = el.value;
    var b = $('undo-confirm'); if (b) b.disabled = !S.undoDraft.reason.trim();
    return;
  }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'denial-file' && S.denial && el.files && el.files[0]) { readLetterFile(el.files[0]); return; }
  if (el.dataset && el.dataset.eppid) { S.epPid = el.value; S.epFocus = null; S.undoFor = null; S.denial = null; S.newTask = null; renderEpisode(); return; }
  if (el.dataset && el.dataset.prop !== undefined && S.denial) { S.denial.on[parseInt(el.dataset.prop, 10)] = el.checked; return; }
  if (el.id === 'f-payer') { S.vals.payer = el.value || null; updateChips(); }
});

/* start in a working state: note 3 loaded, example episode with a stalled delivery */
S.text = noteById(3).text;
